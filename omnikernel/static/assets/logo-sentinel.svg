<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="sent-iris" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="sent-rose" x1="120" y1="0" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="sent-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Hardened Cryptographic Shield Body -->
  <path d="M60 16 L94 28 C94 65 78 88 60 104 C42 88 26 65 26 28 L60 16 Z" fill="#0C101C" stroke="#1E293B" stroke-width="2"/>
  <path d="M60 16 L94 28 C94 65 78 88 60 104 C42 88 26 65 26 28 L60 16 Z" stroke="url(#sent-iris)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Inner AST Node Lattice -->
  <!-- Root Node -->
  <circle cx="60" cy="40" r="4.5" fill="#818CF8" filter="url(#sent-glow)"/>
  <circle cx="60" cy="40" r="2.5" fill="#FFFFFF"/>

  <!-- Branches -->
  <line x1="60" y1="44" x2="44" y2="60" stroke="#6366F1" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="60" y1="44" x2="76" y2="60" stroke="#6366F1" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Child Nodes -->
  <circle cx="44" cy="60" r="3.5" fill="#6366F1"/>
  <circle cx="76" cy="60" r="3.5" fill="#6366F1"/>

  <!-- Sub Branches to Patch Nodes -->
  <line x1="44" y1="64" x2="52" y2="76" stroke="#4338CA" stroke-width="1.5"/>
  <line x1="76" y1="64" x2="68" y2="76" stroke="url(#sent-rose)" stroke-width="1.5"/>

  <!-- Remediation Conduit Node -->
  <circle cx="52" cy="76" r="2.5" fill="#34D399"/>
  <circle cx="68" cy="76" r="2.5" fill="#F43F5E"/>

  <!-- Auto-Patch Shield Lock Check -->
  <path d="M54 88 L58 92 L68 82" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
