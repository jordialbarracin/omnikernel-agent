<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="omni-nvidia" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#88D600"/>
      <stop offset="60%" stop-color="#76B900"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="omni-cyan" x1="0" y1="120" x2="120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D1FF"/>
      <stop offset="100%" stop-color="#76B900"/>
    </linearGradient>
    <filter id="omni-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Silicon Substrate Octagon -->
  <path d="M40 14 L80 14 L106 40 L106 80 L80 106 L40 106 L14 80 L14 40 Z" fill="#0E151E" stroke="#1E293B" stroke-width="2"/>
  <path d="M40 14 L80 14 L106 40 L106 80 L80 106 L40 106 L14 80 L14 40 Z" stroke="url(#omni-nvidia)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Trace Conduits (Silicon Interconnects) -->
  <line x1="14" y1="60" x2="36" y2="60" stroke="#334155" stroke-width="2"/>
  <line x1="106" y1="60" x2="84" y2="60" stroke="#334155" stroke-width="2"/>
  <line x1="60" y1="14" x2="60" y2="36" stroke="#334155" stroke-width="2"/>
  <line x1="60" y1="106" x2="60" y2="84" stroke="#334155" stroke-width="2"/>

  <!-- Tensor Core Diamond Grid -->
  <g transform="translate(60,60)">
    <!-- 4 Tensor Unit Blocks -->
    <rect x="-24" y="-24" width="20" height="20" rx="3" fill="#182333" stroke="url(#omni-nvidia)" stroke-width="1.5"/>
    <rect x="4" y="-24" width="20" height="20" rx="3" fill="#182333" stroke="url(#omni-nvidia)" stroke-width="1.5"/>
    <rect x="-24" y="4" width="20" height="20" rx="3" fill="#182333" stroke="url(#omni-nvidia)" stroke-width="1.5"/>
    <rect x="4" y="4" width="20" height="20" rx="3" fill="#182333" stroke="url(#omni-nvidia)" stroke-width="1.5"/>

    <!-- Central Micro Fusion Node -->
    <circle cx="0" cy="0" r="4" fill="#76B900" filter="url(#omni-glow)"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
    
    <!-- Micro Diagonals -->
    <line x1="-14" y1="-14" x2="14" y2="14" stroke="#76B900" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
