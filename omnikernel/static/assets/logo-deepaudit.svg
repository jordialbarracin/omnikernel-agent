<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="deep-cyan" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#00D1FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="amber-accent" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="deep-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Hexagonal Forensic Prism Base -->
  <path d="M60 14 L98 36 V84 L60 106 L22 84 V36 Z" fill="#0A111E" stroke="#1E293B" stroke-width="2"/>
  <path d="M60 14 L98 36 V84 L60 106 L22 84 V36 Z" stroke="url(#deep-cyan)" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Benford / Statistical Curve Vectors -->
  <path d="M34 78 Q 45 42 60 42 T 86 34" stroke="url(#amber-accent)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Central Due Diligence Monocle / Caliper Balance -->
  <circle cx="60" cy="62" r="18" stroke="url(#deep-cyan)" stroke-width="2" fill="#0E1726" fill-opacity="0.8"/>
  <circle cx="60" cy="62" r="10" stroke="#00D1FF" stroke-width="1.5" stroke-dasharray="2 3"/>

  <!-- Optical Precision Crosshairs -->
  <line x1="60" y1="36" x2="60" y2="44" stroke="#00D1FF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="80" x2="60" y2="88" stroke="#00D1FF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="62" x2="42" y2="62" stroke="#00D1FF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="78" y1="62" x2="86" y2="62" stroke="#00D1FF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Central Verification Node -->
  <circle cx="60" cy="62" r="3.5" fill="#00D1FF" filter="url(#deep-glow)"/>
  <circle cx="60" cy="62" r="1.5" fill="#FFFFFF"/>
</svg>
