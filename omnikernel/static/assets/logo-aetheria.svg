<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="aeth-grad-1" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D1FF"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#76B900"/>
    </linearGradient>
    <linearGradient id="aeth-grad-dark" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <filter id="glow-core" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Isometric Hex Ring -->
  <path d="M60 10 L103.3 35 V85 L60 110 L16.7 85 V35 Z" stroke="url(#aeth-grad-1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
  
  <!-- Trinity Isometric Blocks -->
  <!-- Top Facet -->
  <path d="M60 22 L91.6 40.2 L60 58.5 L28.4 40.2 Z" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
  <path d="M60 22 L91.6 40.2 L60 58.5 L28.4 40.2 Z" fill="url(#aeth-grad-1)" fill-opacity="0.12"/>
  
  <!-- Right Facet -->
  <path d="M60 58.5 L91.6 40.2 V76.8 L60 95 Z" fill="#121215" stroke="#27272A" stroke-width="1.5"/>
  <path d="M60 58.5 L91.6 40.2 V76.8 L60 95 Z" fill="url(#aeth-grad-1)" fill-opacity="0.25"/>

  <!-- Left Facet -->
  <path d="M60 58.5 L28.4 40.2 V76.8 L60 95 Z" fill="#09090B" stroke="#27272A" stroke-width="1.5"/>
  <path d="M60 58.5 L28.4 40.2 V76.8 L60 95 Z" fill="url(#aeth-grad-1)" fill-opacity="0.05"/>

  <!-- Central Dynamic Prism Pulse -->
  <circle cx="60" cy="58.5" r="4.5" fill="#00D1FF" filter="url(#glow-core)"/>
  <circle cx="60" cy="58.5" r="2.5" fill="#FFFFFF"/>
  
  <!-- Vector Nodes -->
  <circle cx="60" cy="10" r="3" fill="#76B900"/>
  <circle cx="103.3" cy="85" r="3" fill="#00D1FF"/>
  <circle cx="16.7" cy="85" r="3" fill="#10B981"/>
</svg>
